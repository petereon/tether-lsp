[project]
name = "tether-lsp"
version = "0.1.0"
description = "Meta language server for tether's mixed MicroPython/PC files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygls>=2.1.1",
    "pyright>=1.1.411",
    "tether-mcu",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tracks tether's main branch directly rather than PyPI - always the latest
# commit, independent of whether tether's own release pipeline is currently
# working (see the 2026-08-03 lockfile/version-bump breakage there).
[tool.uv.sources]
tether-mcu = { git = "https://github.com/petereon/tether", branch = "main" }

[dependency-groups]
dev = []

[project.scripts]
tether-lsp = "tether_lsp.server:main"
